name: preview

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/*'
      - '!.github/workflows/*.yml'
      - '.github/workflows/preview.yml'
      - '!.github/dependabot.yml'
      - '!.vscode/**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
      - '!tests/**'
      - '!vitest.config.ts'
      - '!vitest.setup.ts'
      - '!zizmor.yml'

permissions:
  contents: read

concurrency:
  cancel-in-progress: ${{ github.ref_name != 'main' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

jobs:
  release:
    name: Release preview build
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false # cache can be poisoned by malicious actors.

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          package-manager-cache: false # cache can be poisoned by malicious actors.

      - name: Install dependencies
        run: pnpm i

      - name: Build
        run: pnpm build

      - name: Release preview version
        run: pnpx pkg-pr-new@0.0.71 publish --template './examples/node-esm'
