# https://docs.npmjs.com/trusted-publishers#github-actions-configuration
name: publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  npm:
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-npm

    environment: release
    if: github.repository == 'kysely-org/kysely-ctl'
    name: stage for npm
    permissions:
      contents: read
      id-token: write # Required for OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history to check branch ancestry
          persist-credentials: false

      - name: Verify tag format and branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag does not follow semver!"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$REF_NAME")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Error: tag is not based on main branch"
            exit 1
          fi

          echo "TAG=$REF_NAME" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false # cache can be poisoned by malicious actors.

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false # cache can be poisoned by malicious actors.
          registry-url: https://registry.npmjs.org/

      - name: Verify package version
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('./package.json', 'utf8')).version")

          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: package.json version does not follow semver!"
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Error: tag and package.json version don't match!"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Stage release
        run: pnpm stage publish --no-git-checks --tag latest # the workflow runs in a detached head state, so git checks fail
